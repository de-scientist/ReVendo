services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: revendo
      MYSQL_USER: revendo
      MYSQL_PASSWORD: revendo_local_only
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3306:3306"
    volumes:
      - revendo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local_only"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - revendo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  revendo_mysql_data:
  revendo_redis_data:
